name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Build & Push
        run: |
          docker build -t asia-northeast3-docker.pkg.dev/spharos-flow/flow-repo/flow-backend:${{ github.sha }} ./backend
          docker push asia-northeast3-docker.pkg.dev/spharos-flow/flow-repo/flow-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy flow-backend \
            --image=asia-northeast3-docker.pkg.dev/spharos-flow/flow-repo/flow-backend:${{ github.sha }} \
            --region=asia-northeast3 \
            --platform=managed \
            --project=spharos-flow
