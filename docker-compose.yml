services:
  db:
    image: postgres:16-alpine
    container_name: flow-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flow_db
      POSTGRES_USER: flow_user
      POSTGRES_PASSWORD: flow_password
    volumes:
      - flow-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_user -d flow_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: flow-backend
    ports:
      - "8000:8080"
    environment:
      DATABASE_URL: "postgresql+asyncpg://flow_user:flow_password@db:5432/flow_db"
    depends_on:
      db:
        condition: service_healthy

volumes:
  flow-db-data:
